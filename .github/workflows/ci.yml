name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Pre-commit hooks ────────────────────────────────────────────────
  # Same hygiene + lint + format checks devs run locally via `git commit`.
  # Catches anyone who bypassed local hooks with --no-verify.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (needed for the prettier/eslint hooks)
        working-directory: frontend
        run: npm ci

      - uses: pre-commit/action@v3.0.1

  # ── Backend ─────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/myapp_test
          SECRET_KEY: ci-test-secret-key
        run: pytest -v --cov=app --cov-report=term-missing

  # ── Frontend ────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

  # ── API contract drift check ─────────────────────────────────────────
  # Regenerates frontend/openapi.json and frontend/src/lib/api-types.ts
  # from the live backend and fails if either is out of date. This is
  # the load-bearing guarantee for the typed API client.
  api-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Export OpenAPI schema
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
        run: python scripts/export_openapi.py

      - name: Regenerate TypeScript types
        working-directory: frontend
        run: npm run generate:api

      - name: Fail if generated files are out of date
        run: |
          if ! git diff --quiet frontend/openapi.json frontend/src/lib/api-types.ts; then
            echo "::error::OpenAPI schema or generated types are out of date."
            echo "Run: make generate-api (or scripts/export_openapi.py + npm run generate:api) and commit the changes."
            git diff frontend/openapi.json frontend/src/lib/api-types.ts
            exit 1
          fi

  # ── End-to-end (Playwright) ─────────────────────────────────────────
  # Boots the full docker-compose stack and runs the Playwright suite
  # against http://localhost:3000. Rate limiting is explicitly disabled
  # so the auth endpoints don't 429 the suite — see RATE_LIMIT_ENABLED
  # in backend/app/core/config.py.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Write compose env
        run: |
          cp .env.example .env
          {
            echo ""
            echo "# Disable rate limiting for the E2E run."
            echo "RATE_LIMIT_ENABLED=false"
            echo ""
            echo "# Strong secret so production-guard never fires even if ENVIRONMENT flips."
            echo "SECRET_KEY=ci-e2e-$(openssl rand -hex 32)"
          } >> .env

      - name: Start stack
        run: docker compose up -d --build db backend frontend

      - name: Wait for backend health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/api/v1/health >/dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Backend never became healthy"
          docker compose logs backend
          exit 1

      - name: Run database migrations
        # The backend image starts with an empty schema — apply committed
        # Alembic migrations before the suite hits any auth endpoint.
        # Locally this is persisted in the pgdata volume, but CI starts
        # with a fresh DB on every run.
        run: docker compose exec -T backend alembic upgrade head

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 -o /dev/null 2>&1; then
              echo "Frontend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Frontend never became ready"
          docker compose logs frontend
          exit 1

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Tear down stack
        if: always()
        run: docker compose down -v
