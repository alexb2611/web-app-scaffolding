# Alembic configuration file.

[alembic]
script_location = alembic
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@db:5432/myapp

# Make `app.*` resolvable when alembic is invoked as a console script.
# Without this the build-time stub in site-packages wins and env.py
# crashes with "No module named 'app.core'".
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
